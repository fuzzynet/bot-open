<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening Grok Bot…</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;color:#e8e8e8;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{text-align:center;padding:24px}
h1{font-size:20px;font-weight:500;margin:0 0 8px}
p{color:#999;margin:0 0 24px}
a.btn{display:inline-block;padding:10px 20px;border:1px solid #444;border-radius:10px;color:#e8e8e8;text-decoration:none}
a.btn:hover{background:#1c1c1c}
.hide{display:none}
</style></head>
<body><main>
<h1 id="h">Opening Grok Bot…</h1>
<p id="n"></p>
<a id="b" class="btn hide" href="#">Open Grok Bot</a>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var id=(q.get("id")||"").toLowerCase();
  var name=(q.get("name")||"").slice(0,60);
  var h=document.getElementById("h"),n=document.getElementById("n"),b=document.getElementById("b");
  if(!/^[0-9a-f-]{36}$/.test(id)){h.textContent="This link isn't valid.";return;}
  if(name){n.textContent=name;}
  var url="grokbot://app/v1/agent?id="+id;
  b.href=url;b.classList.remove("hide");
  location.href=url;
})();
</script>
</body></html>
